<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Guitar Groove Practicer</title>
  <script type="module" crossorigin src="/my-guitar-groove-practicer/assets/index-CQunkfPh.js"></script>
  <link rel="stylesheet" crossorigin href="/my-guitar-groove-practicer/assets/index-CqFADmt0.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎸 My Guitar Groove Practicer</h1>
            <p class="subtitle">Practice with endless groove loops</p>
        </header>

        <main>
            <div class="controls">
                <div class="control-group">
                    <label for="style-select">Style:</label>
                    <select id="style-select">
                        <option value="rock">Rock 4/4</option>
                        <option value="blues">Blues Shuffle</option>
                        <option value="funk">Funk 16th</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="root-select">Root Note:</label>
                    <select id="root-select">
                        <option value="E2">E</option>
                        <option value="A2">A</option>
                        <option value="D2">D</option>
                        <option value="G2">G</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="bpm-slider">BPM: <span id="bpm-value">120</span></label>
                    <input type="range" id="bpm-slider" min="60" max="180" value="120">
                </div>
            </div>

            <div class="play-controls">
                <button id="play-button" class="play-button">
                    <span class="play-icon">▶</span>
                    <span class="button-text">PLAY</span>
                </button>
            </div>

            <div class="visualizer">
                <h3>Step Sequencer</h3>
                <div id="step-display" class="step-display">
                    <!-- Steps will be generated by JS -->
                </div>
            </div>
        </main>

        <footer>
            <p>Built with Tone.js | Practice makes perfect! 🎵</p>
        </footer>
    </div>

</body>
</html>
